[build]
  publish = "."

# Internal pages are not for public serving. Return 404 for anything
# under /internal/ (force = true so the static files are not served).
[[redirects]]
  from = "/internal/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# NON-WEB FILES IN THIS REPOSITORY ARE SERVED BY DEFAULT. THESE ARE NOT.
#
# `publish = "."` above means the publish directory IS the repository, so every
# tracked file ships to the live domain whether or not any page links to it.
# Netlify withholds dotfiles and netlify.toml itself; it withholds nothing else.
# Measured 2026-08-06: nine files were fetchable at observerprotocol.org that
# were never meant to be, among them an internal repo map naming private repos
# and on-disk server paths, a site-upgrade guide describing which agent cards
# carried placeholder data, and three social-media exports belonging to a
# different company.
#
# The rules below return a forced 404 for each. Nothing on the site links to any
# of them, so this removes nothing a reader could reach by navigating.
#
# WHAT THIS DOES NOT DO, which matters more than what it does:
#
#   1. It is a DENYLIST. A new .md, .sh, .csv or .py added to this repository is
#      PUBLIC THE MOMENT IT IS MERGED, until someone remembers to add it here.
#      Netlify requires the splat at the end of a path, so `/*.md` is not
#      available and the class cannot be closed by extension.
#   2. It does not remove the files. They remain in git history and are still
#      readable to anyone with repository access, which is the correct scope:
#      the defect was public serving, not their existence.
#
# The durable fix is a publish directory that is not the repository root, so
# that shipping a file is a decision rather than the default. That is a repo
# restructure and is deliberately not being done here.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/REPO_MAP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/IMPLEMENTATION_GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEMO-SCRIPT-MAR18.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/observer-protocol-sdk.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/verify-did-resolution.sh"
  to = "/404.html"
  status = 404
  force = true

# Directory rule, not a file rule: anything added under scripts/ later is
# covered without a further edit. This is the only part of the block above that
# closes a class rather than an instance.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Build and verification tooling. Not web content. Same reasoning as /scripts/*:
# the publish directory is the repository, so anything committed here is served
# unless a rule says otherwise.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# ArcadiaB social scheduling exports. A different company's marketing copy,
# including Mexican regulated-lending claims, on Observer Protocol's domain.
[[redirects]]
  from = "/arcadiab-facebook.csv"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/arcadiab-linkedin-week.csv"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/arcadiab-linkedin.csv"
  to = "/404.html"
  status = 404
  force = true

# OP Crossrail product page — canonical extension-less URL.
[[redirects]]
  from = "/crossrail"
  to = "/crossrail.html"
  status = 200

# OP Enforcement — watch-first DENY demo, canonical extension-less URL.
[[redirects]]
  from = "/enforcement"
  to = "/enforcement.html"
  status = 200

# DID document resolution — must serve JSON per W3C did:web spec.
# The api. subdomain is the canonical source; proxy through the apex
# so the W3C-mandated path observerprotocol.org/agents/{id}/did.json
# returns the actual DID document instead of falling through to the
# human-readable agent listing page (agents.html). This rule MUST
# come before the /agents/* catch-all below.
[[redirects]]
  from = "/agents/:id/did.json"
  to = "https://api.observerprotocol.org/agents/:id/did.json"
  status = 200
  force = true

# Human-readable agent profile pages — existing behavior, preserved.
[[redirects]]
  from = "/agents/*"
  to = "/agents.html"
  status = 200

# Status list credentials — published as static .json files but the
# statusListCredential URL embedded in signed credentials omits the
# extension. Serve the .json content under the extension-less URL.
[[redirects]]
  from = "/status-lists/:id"
  to = "/status-lists/:id.json"
  status = 200

# Credentials — same pattern: signed credential 'id' fields and external
# references may omit .json; serve the underlying file either way.
[[redirects]]
  from = "/credentials/:id"
  to = "/credentials/:id.json"
  status = 200

# Serve status list and credential JSON with correct content-type + CORS.
[[headers]]
  for = "/status-lists/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/credentials/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# WHITEPAPER REMOVED FROM THE SERVED SITE, 2026-08-03.
#
# It was de-indexed on 2026-07-13 and kept reachable as an archived doc. That was the wrong end state:
# nothing on the site linked either URL, four copies existed with four different hashes so there was no
# canonical version, and a claim known to be false was live at a fetchable URL. De-indexing stops search
# engines; it does not stop anyone who has the link.
#
# The files are retained off the served site — in op-legacy-deployment, in this repo's git history, and
# on disk. This removes what we SERVE, not what we keep. Deliberately not replaced with a redirect or a
# tombstone: there is nothing current to point at.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JSON Schema files — dereferenceable $id URLs for W3C VC ecosystem
[[headers]]
  for = "/schemas/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# DID documents — cryptographic verification critical path
[[headers]]
  for = "/.well-known/did.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
