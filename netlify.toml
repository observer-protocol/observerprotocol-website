[build]
  publish = "_site"
  command = "bash tools/build-site.sh"

# ---------------------------------------------------------------------------
# THE PUBLISH DIRECTORY IS BUILT, NOT THE REPOSITORY.
#
# Until 2026-08-25 this said `publish = "."`, so every tracked file shipped to the
# live domain unless a forced-404 rule below named it. That was a denylist and
# it did not close the class: a new .md, .csv, .sh or .py was public the moment
# it merged, and nothing looked broken when it happened. Measured 2026-08-06:
# nine such files were fetchable, among them an internal repo map, a site-upgrade
# guide, and three social-media exports belonging to a different company.
#
# tools/build-site.sh now builds `_site/` from an ALLOWLIST (root web files by
# extension, plus named directories), refuses if any non-web kind reaches the
# output, and prints every tracked file it withheld. Shipping a file is a
# decision made in that script, in a commit. The per-file forced-404 rules that
# stood here are gone with the files they named (removed from the tree 2026-08-25
# under the OPEN-CLOSED-RULE ledger) and with the mechanism that made them
# necessary; scripts/ and tools/ are not in the allowlist and do not ship.
# ---------------------------------------------------------------------------

# OP Crossrail product page — canonical extension-less URL.
[[redirects]]
  from = "/crossrail"
  to = "/crossrail.html"
  status = 200

# OP Enforcement — watch-first DENY demo, canonical extension-less URL.
[[redirects]]
  from = "/enforcement"
  to = "/enforcement.html"
  status = 200

# The public attestation checker — canonical extension-less URL.
#
# Deliberately NO [[headers]] block for this page. It loads nothing: no font, no
# stylesheet, no script src, no fetch. There is no origin to allow, nothing to cache
# beyond the document, and a CORS or cache header here would be the first line of a
# drift towards this page fetching something. The sitewide /* header block already
# gives it X-Frame-Options, nosniff and a referrer policy.
[[redirects]]
  from = "/check"
  to = "/check.html"
  status = 200

# DID document resolution — must serve JSON per W3C did:web spec.
# The api. subdomain is the canonical source; proxy through the apex
# so the W3C-mandated path observerprotocol.org/agents/{id}/did.json
# returns the actual DID document instead of falling through to the
# human-readable agent listing page (agents.html). This rule MUST
# come before the /agents/* catch-all below.
[[redirects]]
  from = "/agents/:id/did.json"
  to = "https://api.observerprotocol.org/agents/:id/did.json"
  status = 200
  force = true

# Human-readable agent profile pages — existing behavior, preserved.
[[redirects]]
  from = "/agents/*"
  to = "/agents.html"
  status = 200

# Status list credentials — published as static .json files but the
# statusListCredential URL embedded in signed credentials omits the
# extension. Serve the .json content under the extension-less URL.
[[redirects]]
  from = "/status-lists/:id"
  to = "/status-lists/:id.json"
  status = 200

# Credentials — same pattern: signed credential 'id' fields and external
# references may omit .json; serve the underlying file either way.
[[redirects]]
  from = "/credentials/:id"
  to = "/credentials/:id.json"
  status = 200

# Retired 2026-08-08. These three quickstarts documented agent reputation scoring,
# a surface the protocol no longer offers. quickstart-stripe additionally documented
# observer.reputationMiddleware, which exists at no published version of the package
# it named.
#
# 410 rather than 404, deliberately: 404 says "nothing is here", which invites a
# crawler to retry and a reader to assume a broken link. 410 says "this existed and
# was withdrawn", which is the true statement. No redirect, because no remaining page
# covers the same rail and implying one would be a different inaccuracy.
[[redirects]]
  # THE SOVEREIGN RETIREMENT, 410'd 2026-08-23. One product, retired in one pass.
  #
  # Sovereign belonged to the previous product: it moved money on crypto rails, and the
  # current product does not move money. It joins maxi-0001, vicky-0002, the genesis
  # transaction and the mainnet refusal in SUPERSEDED.
  #
  # sovereign.html was the protocol site's page for it. It was reachable only from
  # sitemap.xml -- no page on either property linked it -- and its one call to action
  # opened sovereign.agenticterminal.io, which is retired with it.
  from = "/sovereign.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  # free-your-agent.html, 410'd 2026-08-23. A dated live demo (2026-05-27) of a spending
  # cap on Liquid testnet: a wallet, a cap, a payment. Every load-bearing element is
  # wallet-era.
  #
  # ITS ONE TRANSFERABLE IDEA HAD NO ARTIFACT BEHIND IT, and that is why it goes whole
  # rather than being reframed. Beat 4 described "a small Python script with zero Observer
  # Protocol dependencies" reproducing SHA-256 bindings and verifying Ed25519 against
  # published #key-3. That script is named nowhere and served nowhere. It is the same shape
  # as deciderArtifactDigest naming a ppp/engine.py that is published nowhere: a check a
  # reader is invited to make and cannot.
  from = "/free-your-agent.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  # chargeback-prevention/, 410'd 2026-08-23. An investor narrative on a protocol site --
  # "the thesis", "what the smart money is converging on", "the honest call to action" --
  # built around a six-beat demo whose user-facing surface was Sovereign.
  #
  # ONE PARAGRAPH WAS KEPT AND MOVED FIRST. "On openness, and what we charge for" stated
  # the licensing position, named what is NOT open, and existed in that form on no other
  # page of either property. It now lives on /architecture, beside the design principles,
  # with the wallet-era clause replaced and the encoding rule added.
  #
  # IT ALSO CARRIED A FALSE CLAIM, recorded here rather than left behind: "an SDK in
  # production", when @observer-protocol/sdk, @observerprotocol/sdk and PyPI
  # observer-protocol are all deprecated or unmaintained, last released April 2026.
  from = "/chargeback-prevention"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/chargeback-prevention/*"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/quickstart-stripe.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/quickstart-l402.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  # verify-receipt.html, 410'd 2026-08-09. A public "Independent Credential
  # Verification" tool that could never return valid for anything this site
  # publishes. It required proof.type Ed25519Signature2020; all 8 published
  # credentials use DataIntegrityProof / eddsa-jcs-2022. Independently, its
  # canonicalisation passed a key array as JSON.stringify's REPLACER argument,
  # which is an allowlist applied at every level rather than a sort order, so
  # credentialSubject serialised as {} and the payload was absent from the
  # signed bytes. Failed closed, so never falsely valid — and never correctly
  # valid either. See /verify.html for the real path.
  from = "/verify-receipt.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  # agent.html, 410'd 2026-08-09. It had NEVER rendered: renderAgentProfile's first
  # line read agent.badges, which the API does not return, so every visitor got a
  # TypeError. It also awarded Platinum/Gold/Silver/Bronze tiers on transaction count
  # — the reputation model with none of its vocabulary, invisible to the $forbidden
  # stem check by construction. Nothing to preserve: repairing it meant building a
  # page nobody had seen work, to show fields the API does not return, for a model we
  # removed. The API's profile_url points at /agents/{id}, not here, so nothing that
  # advertises an agent profile is broken by this.
  from = "/agent.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/quickstart-lnget.html"
  to = "/gone.html"
  status = 410
  force = true

[[redirects]]
  from = "/quickstart-solana.html"
  to = "/gone.html"
  status = 410
  force = true

# Serve status list and credential JSON with correct content-type + CORS.
[[headers]]
  for = "/status-lists/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/credentials/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# WHITEPAPER REMOVED FROM THE SERVED SITE, 2026-08-03.
#
# It was de-indexed on 2026-07-13 and kept reachable as an archived doc. That was the wrong end state:
# nothing on the site linked either URL, four copies existed with four different hashes so there was no
# canonical version, and a claim known to be false was live at a fetchable URL. De-indexing stops search
# engines; it does not stop anyone who has the link.
#
# The files are retained off the served site — in op-legacy-deployment, in this repo's git history, and
# on disk. This removes what we SERVE, not what we keep. Deliberately not replaced with a redirect or a
# tombstone: there is nothing current to point at.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# /schemas/delegation/ is a REDIRECT, not a page in that directory, and the header
# rule below is the whole reason.
#
# `v2.2.json` tells its reader, in its own $comment, to "See /schemas/delegation/ for
# published versions". That path 404d. The obvious fix was an index.html in that
# directory, and it is the wrong fix: the rule below sets Content-Type application/json
# for everything matching /schemas/*, and X-Content-Type-Options: nosniff is set site-
# wide, so a browser would be told the page is JSON and refuse to render it as HTML.
#
# WHETHER A LATER, MORE SPECIFIC HEADER RULE WOULD OVERRIDE THAT WAS NOT ESTABLISHED.
# `netlify dev` serves the HTML as text/html, but it also serves cache-control:
# max-age=0 where the rule below says 3600, so it does not reproduce this file's header
# handling faithfully enough to settle the question. Rather than ship a page whose
# content type depends on an untested precedence rule, the page lives outside
# /schemas/ where the ordinary HTML headers apply, and this redirect carries the
# reader from the path the schema names to the page that answers it.
[[redirects]]
  from = "/schemas/delegation/"
  to = "/delegation-schema-versions.html"
  status = 301

# JSON Schema files — dereferenceable $id URLs for W3C VC ecosystem
[[headers]]
  for = "/schemas/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# DID documents — cryptographic verification critical path
[[headers]]
  for = "/.well-known/did.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
