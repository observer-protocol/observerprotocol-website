name: Published credentials verify

# observerprotocol.org tells readers to install @observer-protocol/policy-engine
# and check our records themselves. This job runs that same check against every
# artifact the repository publishes, so a credential that our own verifier
# refuses cannot reach the live domain unnoticed.
#
# The check is symmetric: it fails when a passing artifact regresses AND when a
# failing artifact starts passing (a stale expectation), AND when an artifact is
# published with no expectation recorded at all.

on:
  push:
    paths:
      - 'credentials/**'
      - 'verify-samples/**'
      - 'scripts/verify-published-credentials.mjs'
      - 'scripts/credential-expectations.json'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - 'scripts/sync-engine-version.mjs'
      - 'scripts/check-shared-copy.mjs'
      - 'scripts/shared-copy.json'
      - 'scripts/check-measured-figures.mjs'
      - 'scripts/measured-figures.json'
      - 'scripts/measure-signed-record-coverage.mjs'
      - 'scripts/measure-engine-payload-exports.mjs'
      - 'scripts/measure-schema-claims.mjs'
      - 'scripts/measure-hosted-verifier.mjs'
      - 'scripts/check-outbound-links.mjs'
      - 'scripts/mustresolve.json'
      - 'scripts/known-dead-links.json'
      - 'schemas/**'
      - 'results/**'
      - '**/*.html'
      - '.github/workflows/verify-published-artifacts.yml'
  pull_request:
  workflow_dispatch:
  # The engine resolves DID documents and revocation lists over the network, so a
  # credential can begin failing without this repository changing at all: a key
  # rotation, an expiry, or a revocation. Catch that on a schedule too.
  schedule:
    - cron: '17 6 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci, not npm install. install honours the lockfile when it can and rewrites
      # it when it cannot, silently; ci refuses outright on a lock/manifest mismatch.
      # Measured 2026-08-08: with the lockfile removed, ^1.0.0-rc.5 resolves to rc.7,
      # so the pin was doing all the work and nothing enforced that it would keep doing it.
      - id: deps
        run: npm ci --no-audit --no-fund

      # EVERY CHECK BELOW RUNS EVEN IF AN EARLIER ONE FAILED, and that is the point of
      # `if: !cancelled()`.
      #
      # MEASURED 2026-08-10. A step failure ends the job, so when the engine-version check
      # went red on an rc.10-vs-rc.12 drift, `check-shared-copy` was SKIPPED on every run
      # for at least thirteen hours — including the run for PR #46, which merged with the
      # estate's principal copy control never having executed. The PR page said
      # `verify fail` and said nothing about what else had not run.
      #
      # A red build then meant one known failure and an unknown number of unrun checks,
      # which is strictly worse than several known failures. An earlier gate hiding a later
      # one is the same defect this repository keeps finding in its own documents, at
      # workflow scope.
      #
      # The order also changed: the two checks about THIS REPOSITORY'S CONTENT come first,
      # and the version check — which can go red because someone published to npm, with no
      # commit here — comes last. If a future edit removes the conditions, the steps that
      # survive are the ones about our own artifacts.
      #
      # `steps.deps.outcome` is required, not decorative, ON THE THREE STEPS THAT CARRY IT:
      # without npm ci those three cannot run at all, and letting them try would report a
      # missing module as a copy defect.
      #
      # The first step below deliberately does NOT carry it. It imports nothing from the
      # package: it compares figures printed on our pages against results/, and both are in
      # this repository. Gating it on an npm install would let a registry outage skip the one
      # check that stops a count on the homepage drifting away from the measurement behind it.
      - name: Figures in copy match results/
        if: ${{ !cancelled() }}
        run: node ./check-measured-figures.mjs
      # Also ungated on `steps.deps`: it imports nothing from the package, and a registry
      # outage must not skip the check that follows what we publish to a reader.
      - name: Outbound links resolve
        if: ${{ !cancelled() }}
        run: node ./check-outbound-links.mjs
      - name: Verify every published credential
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node ./verify-published-credentials.mjs
      - name: Shared copy has not diverged between pages
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node ./check-shared-copy.mjs
      - name: Engine version matches the lockfile AND what npm serves a reader
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: node ./sync-engine-version.mjs --check

      # LAST, AND ON ITS OWN NODE, for one reason: the public checker's signature cases run
      # on WebCrypto Ed25519, and this job otherwise pins Node 20, where that primitive is
      # still experimental. Putting the newer runtime on the final step leaves every step
      # above on the version it was measured against, and makes a failure here a fact about
      # check.html rather than about a runtime difference. The script refuses outright when
      # the primitive is missing rather than letting the resulting mess read as a page defect.
      #
      # Not gated on `steps.deps`: it imports nothing from the package. /check.html is the one
      # page on this site that reaches a verdict on a visitor's own artifact, and a registry
      # outage must not be the reason nothing checked it.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - name: The public checker verifies the published sample and refuses broken ones
        if: ${{ !cancelled() }}
        run: node ./check-public-checker.mjs

      # served-page-audit.mjs runs OUTSIDE this repository, on a clock, because the change
      # it watches for produces no commit. It therefore carries baked-in values it cannot
      # derive at run time: the hashes of check.html's own inline scripts, and its own
      # content hash. This step is the only thing keeping those true.
      #
      # It touches no network, so it runs on pull requests too. It has to: the values go
      # stale on a commit to check.html, which is exactly what a pull request is.
      - name: The standalone audit's baked-in hashes still match the files
        if: ${{ !cancelled() }}
        run: node ./check-audit-expectations.mjs

      # THE SUBJECT HERE IS THE LIVE SITE, NOT THIS CHECKOUT, and it runs through a wrapper
      # rather than directly because the audit has four exit codes and a `run:` step has two.
      #
      #   0  clean                                 step passes
      #   1  established mismatch                  step FAILS
      #   3  absent on a single observation        step FAILS
      #   2  production could not be reached       step PASSES, with NOT CHECKED on the run
      #                                            page as a summary block and an annotation
      #
      # Collapsing 2 into failure would let somebody else's outage redden a build that is
      # reviewing a diff, and a red build meaning "a host was down" teaches people that red
      # means nothing. Collapsing it into a silent pass is the same defect one layer up, in
      # the display: a skipped check that looks identical to a passed one.
      #
      # MEASURED BY MUTATION 2026-08-17: with the exit-2 branch removed from the wrapper, an
      # unreachable host takes this step from exit 0 to exit 1. The separation is
      # load-bearing rather than decorative, which is the thing that had to be established.
      #
      # No --observations: a runner is ephemeral, so nothing it writes survives to a next run
      # and absence could never be corroborated from here. Corroboration is the scheduled
      # copy's job, on a host that keeps its own file. What CI can say is "absent, and nobody
      # has established that", which is exit 3, which blocks.
      - name: What a visitor receives at /check
        if: ${{ !cancelled() }}
        shell: bash
        run: ./ci-served-page-audit.sh https://observerprotocol.org/check --disclose=cloudflareinsights
